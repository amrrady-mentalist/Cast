name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            echo "KEYSTORE_BASE64 secret not set; generating temporary upload keystore for CI build."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "${{ secrets.STORE_PASSWORD || 'android' }}" \
              -alias upload \
              -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=BeamScreen,O=BeamScreen,C=US"
          fi

      - name: Build Release APK and App Bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: beamscreen-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: beamscreen-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
